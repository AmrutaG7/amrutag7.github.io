<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Home - Amruta Gandhe</title>
  <style>
    :root {
      --bg-color: #faf9f9;
      --header-color: #AFEEEE;
      --card-bg: #E0FFFF;
      --primary-color: #333;
      --accent-color: #AFEEEE;
      --header-footer-color: #AFEEEE;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--primary-color);
      line-height: 1.6;
      padding-bottom: 100px;
      font-size: 16px;
    }

    /* ===== NAVIGATION ===== */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background-color: var(--header-color);
      border-bottom: 1px solid var(--accent-color);
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
      flex-wrap: wrap;
    }

    .nav-name {
      font-weight: 700;
      font-size: 1.1rem;
      color: #2F4F4F;
      flex-shrink: 0;
    }

    .nav-links-wrapper {
      display: flex;
      justify-content: flex-end;
      flex-grow: 1;
    }

    .nav-links-wrapper ul {
      list-style: none;
      display: flex;
      gap: 25px;
      margin: 0;
      padding: 0;
    }

    .nav-links-wrapper a {
      text-decoration: none;
      color: #2F4F4F;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nav-links-wrapper a svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.5;
    }

    .hamburger {
      display: none;
      font-size: 1.8rem;
      background: none;
      border: none;
      cursor: pointer;
      color: #2F4F4F;
    }

    /* ===== TOP IMAGE ===== */
    .top-image {
      margin-top: 70px;
      width: 100%;
      overflow: hidden;
    }

    .top-image img {
      width: 100%;
      height: auto;
      display: block;
      max-height: 400px;
    }

    /* ===== HERO ===== */
    .hero {
      text-align: center;
      padding: 60px 20px;
    }

    .hero p {
      font-size: 1.2rem;
      margin: 0;
    }

    /* ===== PROJECT GRID ===== */
    .project-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 40px 20px;
      max-width: 1000px;
      margin: 0 auto 60px;
    }

    .project-card {
      flex: 1 1 140px;
      max-width: 160px;
      background-color: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      font-weight: 600;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      text-align: center;
    }

    .project-card.tableau { background-color: #FAD6D6; }
    .project-card.database { background-color: #fcf6d7; }
    .project-card.warehouse { background-color: #efe3ff; }
    .project-card.python { background-color: #F5F5DC; }
    .project-card.mining { background-color: #F0F8FF; }
    .project-card.experience-card { background-color: #FFF0F5; }

    /* ===== FOOTER ===== */
    footer {
      background: var(--header-color);
      border-top: 1px solid var(--accent-color);
      padding: 20px;
      text-align: center;
      font-size: 0.9rem;
    }

    footer .social-links {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin-bottom: 10px;
    }

    footer a {
      text-decoration: none;
      color: #2F4F4F;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    footer a svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.5;
    }

    /* ===== MOBILE (MATCH about.html) ===== */
    @media (max-width: 768px) {

      .top-image img {
        max-height: 220px;
      }

      .nav-links-wrapper {
        display: none;
        width: 100%;
        flex-direction: column;
        background-color: var(--header-footer-color);
        border-top: 1px solid var(--accent-color);
        margin-top: 10px;
      }

      .nav-links-wrapper.active {
        display: flex;
      }

      .nav-links-wrapper ul {
        flex-direction: column;
        gap: 10px;
        padding: 10px 0;
      }

      .nav-links-wrapper li {
        width: 100%;
      }

      /* ICON ABOVE TEXT */
      .nav-links-wrapper a {
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 8px 0;
      }

      .hamburger {
        display: block;
      }

      .project-grid {
        flex-direction: column;
        align-items: center;
      }

      footer {
        text-align: center;
      }

      footer .social-links {
        flex-direction: row;
        justify-content: center;
        gap: 20px;
      }
    }
  </style>
</head>

<body>

<nav>
  <div class="nav-name">Amruta Gandhe</div>
  <button class="hamburger"
          aria-label="Toggle navigation"
          aria-expanded="false"
          aria-controls="nav-links">
    ☰
  </button>

  <div class="nav-links-wrapper" id="nav-links">
    <ul>
      <li><a href="index.html"><svg viewBox="0 0 24 24"><path d="M3 12L12 3l9 9"/><path d="M9 21V12h6v9"/></svg>Home</a></li>
      <li><a href="about.html"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M5.5 21c1.5-4 11.5-4 13 0"/></svg>About</a></li>
      <li><a href="experience.html"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 3H8v4h8z"/></svg>Professional Experience</a></li>
      <li><a href="projects.html"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Project Portfolio</a></li>
      <li><a href="contact.html"><svg viewBox="0 0 24 24"><path d="M21 10.5V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v4.5"/><path d="M3 10.5V18a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7.5l-9 5-9-5z"/></svg>Contact</a></li>
    </ul>
  </div>
</nav>

<!-- CONTENT REMAINS UNCHANGED -->

<script>
  const hamburger = document.querySelector('.hamburger');
  const navWrapper = document.querySelector('.nav-links-wrapper');

  hamburger.addEventListener('click', () => {
    const expanded = hamburger.getAttribute('aria-expanded') === 'true';
    hamburger.setAttribute('aria-expanded', !expanded);
    navWrapper.classList.toggle('active');
  });
</script>

</body>
</html>
