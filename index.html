<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Home - Amruta Gandhe</title>
  <style>
    :root {
      --bg-color: #faf9f9;
      --header-color: #AFEEEE;
      --card-bg: #E0FFFF;
      --primary-color: #333;
      --accent-color: #AFEEEE;
      --header-footer-color: #AFEEEE;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--primary-color);
      line-height: 1.6;
      padding-bottom: 100px;
      font-size: 16px;
    }

    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background-color: var(--header-color);
      border-bottom: 1px solid var(--accent-color);
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
    }

    .nav-name {
      font-weight: 700;
      font-size: 1.1rem;
      color: #2F4F4F;
    }

    .nav-links-wrapper {
      display: flex;
      justify-content: flex-end;
      flex-grow: 1;
      gap: 25px;
    }

    .nav-links-wrapper ul {
      list-style: none;
      display: flex;
      gap: 25px;
      margin: 0;
      padding: 0;
    }

    .nav-links-wrapper a {
      text-decoration: none;
      color: #2F4F4F;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nav-links-wrapper a svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.5;
    }

    .hamburger {
      display: none;
      font-size: 1.8rem;
      background: none;
      border: none;
      cursor: pointer;
    }

    /* ===== TOP IMAGE ===== */
    .top-image {
      margin-top: 70px; /* below navbar */
      width: 100%;
      overflow: hidden;
    }

    .top-image img {
      width: 100%;
      height: auto;
      display: block;
      max-height: 400px;
    }

    /* ===== HERO ===== */
    .hero {
      text-align: center;
      padding: 60px 20px;
    }

    .hero p {
      font-size: 1.2rem;
      margin: 0;
    }

    /* ===== FOOTER ===== */
    footer {
      background: var(--header-color);
      border-top: 1px solid var(--accent-color);
      padding: 20px;
      text-align: center;
      font-size: 0.9rem;
    }

    footer .social-links {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin-bottom: 10px;
    }

    footer a {
      text-decoration: none;
      color: #2F4F4F;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    footer a svg {
      width: 24px;
      height: 24px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.5;
    }

    @media (max-width: 768px) {
      .top-image img {
        max-height: 220px;
      }

      footer {
        text-align: center;
      }

      footer .social-links {
        flex-direction: row;
        justify-content: center;
        gap: 20px;
        margin-bottom: 10px;
      }

      .nav-links-wrapper {
        justify-content: flex-start;
        flex-direction: column;
        display: none;
        background-color: var(--header-footer-color);
        width: 100%;
      }

      .nav-links-wrapper.active {
        display: flex;
      }

      .hamburger {
        display: block;
      }
    }
  </style>
</head>

<body>

<nav>
  <div class="nav-name">Amruta Gandhe</div>
  <button class="hamburger" aria-label="Toggle navigation">☰</button>

  <div class="nav-links-wrapper" id="nav-links">
    <ul>
      <li>
        <a href="index.html" aria-label="Home">
          <svg viewBox="0 0 24 24"><path d="M3 12L12 3l9 9"/><path d="M9 21V12h6v9"/></svg>
          Home
        </a>
      </li>
      <li>
        <a href="about.html" aria-label="About">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M5.5 21c1.5-4 11.5-4 13 0"/></svg>
          About
        </a>
      </li>
      <li>
        <a href="experience.html" aria-label="Professional Experience">
          <svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 3H8v4h8V3z"/></svg>
          Professional Experience
        </a>
      </li>
      <li>
        <a href="contact.html" aria-label="Contact">
          <svg viewBox="0 0 24 24"><path d="M21 10.5V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v4.5"/><path d="M3 10.5V18a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7.5l-9 5-9-5z"/></svg>
          Contact
        </a>
      </li>
    </ul>
  </div>
</nav>

<!-- ===== TOP IMAGE ===== -->
<div class="top-image">
  <img src="assets/home-banner.jpg" alt="Business Analytics Banner">
</div>

<div class="hero">
  <p>Welcome to my Business Analytics portfolio.</p>
</div>

<!-- ===== NEW WELCOME SECTION ===== -->
<section style="max-width:900px; margin: 40px auto; text-align:center;">
  <h2>Welcome</h2>
  <p>
    This portfolio highlights my professional experience, analytics projects,
    and data-driven work across banking and healthcare domains.
  </p>
</section>

<footer>
  <div class="social-links">
    <a href="mailto:asgandhe@hotmail.com" aria-label="Send email">
      <svg viewBox="0 0 24 24">
        <path d="M4 4h16v16H4z" />
        <path d="M4 4l8 8 8-8" />
      </svg>
      <span>Email</span>
    </a>
    <a class="linkedin-icon" href="https://www.linkedin.com/in/amruta-gandhe-1b1013207/" target="_blank" aria-label="LinkedIn">
      <svg viewBox="0 0 24 24">
        <rect x="4" y="4" width="16" height="16" rx="2" />
        <path d="M8 11v5M8 8v.01M12 11v5m0-3a2 2 0 0 1 4 0v3" />
      </svg>
      <span>LinkedIn</span>
    </a>
  </div>
  <div>© Amruta Gandhe</div>
</footer>

<script>
  const hamburger = document.querySelector('.hamburger');
  const navWrapper = document.querySelector('.nav-links-wrapper');

  hamburger.addEventListener('click', () => {
    navWrapper.classList.toggle('active');
  });
</script>

</body>
</html>
